# .cnb.yml

# 匹配以 develop 开头的分支名
develop*:
  ## 推送触发
  push:
    - services:
        - docker
      runner:
        tags: cnb:arch:amd64
        cpus: 64
      imports:
        - https://cnb.cool/xwsir/dinphy/env/-/blob/main/moments.yml
      stages:
        - name: 登录Docker仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 获取dev版本号和提交ID
          script: |
            # 获取当前提交ID
            COMMIT_ID=$(git rev-parse --short HEAD)
            # 获取时间戳作为dev版本号
            DEV_VERSION=$(date +%s)
            echo "DEV_VERSION=${DEV_VERSION}"
            echo "COMMIT_ID=${COMMIT_ID}"
          exports:
            info: DEV_VERSION
            info: COMMIT_ID
        - name: 编译Docker dev镜像
          script: docker build --build-arg VERSION=dev-${DEV_VERSION} --build-arg COMMIT_ID=${COMMIT_ID} -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dev-$DEV_VERSION .
        - name: 推送Docker镜像到CNB
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:dev-$DEV_VERSION  
# 构建以 main 开头的分支
main*:
  web_trigger_main:
    - services:
        - docker
      runner:
        tags: cnb:arch:amd64
        cpus: 64
      imports:
        - https://cnb.cool/xwsir/dinphy/env/-/blob/main/moments.yml
      stages:
        - name: 登录Docker仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 获取版本号和提交ID
          script: |
            # 获取当前提交ID
            COMMIT_ID=$(git rev-parse --short HEAD)
            # 获取最新的标签作为版本号，如果没有标签则使用提交ID
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-${COMMIT_ID}")
            echo "VERSION=${VERSION}"
            echo "COMMIT_ID=${COMMIT_ID}"
          exports:
            info: VERSION
            info: COMMIT_ID
        - name: 编译Docker latest镜像
          script: docker build --build-arg VERSION=${VERSION} --build-arg COMMIT_ID=${COMMIT_ID} -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
        - name: 推送Docker镜像到CNB
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
