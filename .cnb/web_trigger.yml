# .cnb/web_trigger.yml
branch:
  # 如下按钮在分支名以 dev 开头的分支详情页面显示
  - reg: "^develop"
    buttons:
      - name: 构建测试
        description: 打包测试环境包
        event: web_trigger_develop
        permissions:
          # roles 和 users 配置其中之一或都配置均可，二者满足其一即可
          roles:
            - owner
            - master
